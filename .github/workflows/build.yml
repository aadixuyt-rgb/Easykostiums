name: Build EasySnup

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build mod
        run: gradle build --no-daemon

      - name: Build texture pack (zip)
        run: |
          mkdir -p pack-out
          cp -r src/main/resources/assets pack-out/assets
          printf '{"pack":{"pack_format":46,"description":"EasySnup - tekstury armoru (Snup + Adix)"}}' > pack-out/pack.mcmeta
          (cd pack-out && zip -r ../EasySnup-Textures.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: EasySnup-mod
          path: |
            build/libs/easysnup-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: EasySnup-Textures
          path: EasySnup-Textures.zip
          if-no-files-found: error
